plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '2.1.4'
group = 'com.daldon.snowyroofs'
base { archivesName = 'daldons-snowy-roofs' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { snowyroofs { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { snowyroofs { source sourceSets.main } } }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { manifest { attributes(['Specification-Title':'Daldons Snowy Roofs', 'Implementation-Version':project.version]) } }


// Generate Minecraft-style 16x16 snowy texture variants as real PNG resources.
// Keep this in Gradle so the GitHub Actions build packages them in the JAR.
def snowOutput = layout.buildDirectory.dir('generated/snowy-resources')
sourceSets.main.resources.srcDir(snowOutput)
tasks.register('generateSnowTextures') {
    outputs.dir(snowOutput)
    doLast {
        def directory = snowOutput.get().file('assets/daldonssnowyroofs/textures/block').asFile
        directory.mkdirs()
        def types = [
            base_roof: [106, 84, 76],
            white_roof: [224, 219, 211],
            black_roof: [59, 60, 65],
            gray_roof: [119, 118, 118],
            light_gray_roof: [169, 168, 171],
            thatch: [142, 116, 72],
            snow_generic: [225, 231, 240]
        ]
        types.each { name, base ->
            for (int variant = 0; variant < 6; variant++) {
                for (int stage = 1; stage <= 8; stage++) {
                    def image = new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                    def rng = new java.util.Random(name.hashCode() * 31L + variant * 811L + 857L)
                    for (int y = 0; y < 16; y++) {
                        for (int x = 0; x < 16; x++) {
                            // Crisp pixel clusters with high contrast; no blur or antialiasing.
                            // Each variant has a unique ridge, packed snowgrain and ice pattern.
                            int grainTile = Math.floorMod(x.intdiv(2) * 11 + y.intdiv(2) * 17 + variant * 23 + name.hashCode(), 13);
                            int ridgeTile = Math.floorMod(x * 3 + y * 2 + variant * 7, 17);
                            int patch = Math.floorMod(x.intdiv(3) * 19 + y.intdiv(3) * 29 + variant * 11, 23);
                            double density = Math.max(0.0, Math.min(1.0, (stage - 1) / 7.0 + 0.18
                                + (patch < 8 ? 0.15 : -0.08) + (ridgeTile < 6 ? 0.08 : 0.0)));
                            double cover = density * density * (3 - 2 * density);
                            if (stage == 8) cover = 1.0;

                            // Deliberately limited pixel palette: readable from a distance.
                            int tone = grainTile < 2 ? -16 : (grainTile < 5 ? -9 : (grainTile < 9 ? -3 : 2));
                            if (ridgeTile == 0 || ridgeTile == 1) tone -= 11;
                            int snowR = 248 + tone;
                            int snowG = 250 + tone;
                            int snowB = 254 + tone / 2;
                            // ALL six variants have icy crystals; each has different
                            // positions, sizes, silhouettes and blue highlight strength.
                            int iceX = 2 + Math.floorMod(variant * 7 + name.hashCode(), 11);
                            int iceY = 3 + Math.floorMod(variant * 3 + name.hashCode(), 8);
                            int dx = x - iceX, dy = y - iceY;
                            boolean needle = (Math.abs(dx) <= (variant % 3 == 0 ? 0 : 1)
                                    && dy >= -1 && dy <= (variant % 2 == 0 ? 3 : 2));
                            boolean crystalCluster = variant % 2 == 1 && dy == 1 && Math.abs(dx) <= 2;
                            boolean secondFleck = Math.floorMod(x * 13 + y * 7 + variant * 19, 101) == 0;
                            boolean crystal = stage >= 3 && (needle || crystalCluster || secondFleck);
                            if (crystal) {
                                int strength = 7 + variant * 5;
                                snowR = 222 - strength + (dx == 0 ? 12 : 0);
                                snowG = 237 - strength / 3 + (dy == -1 ? 10 : 0);
                                snowB = 255;
                            }
                            int r = Math.max(0, Math.min(255, Math.round(base[0] * (1.0 - cover) + snowR * cover) as int))
                            int g = Math.max(0, Math.min(255, Math.round(base[1] * (1.0 - cover) + snowG * cover) as int))
                            int b = Math.max(0, Math.min(255, Math.round(base[2] * (1.0 - cover) + snowB * cover) as int))
                            image.setRGB(x, y, (255 << 24) | (r << 16) | (g << 8) | b)
                        }
                    }
                    javax.imageio.ImageIO.write(image, 'png',
                        new File(directory, name + '_snow_' + stage + '_v' + variant + '.png'))
                }
            }
        }

        // Attic windows: thin irregular snow at the TOP of the glass only.
        // The rest of every pixel remains transparent, so the glass is visible.
        for (int variant = 0; variant < 6; variant++) {
            for (int stage = 1; stage <= 8; stage++) {
                def image = new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                for (int x = 0; x < 16; x++) {
                    int noise = Math.floorMod(x.intdiv(3) * 11 + x * 3 + variant * 17, 7)
                    int depth = Math.max(1, Math.min(4, 1 + stage.intdiv(4) + (noise < 2 ? 1 : 0)))
                    int drip = Math.floorMod(variant * 5 + 3, 16)
                    if (stage >= 6 && x == drip) depth += 2
                    for (int y = 0; y < Math.min(16, depth); y++) {
                        int shade = Math.floorMod(x * 13 + y * 7 + variant * 19, 11) < 3 ? -13 : -3
                        boolean blueIce = x == drip && y >= depth - 2
                        int red = blueIce ? 194 : 249 + shade
                        int green = blueIce ? 233 : 251 + shade
                        int blue = blueIce ? 255 : 255 + shade.intdiv(3)
                        red = Math.max(0, Math.min(255, red))
                        green = Math.max(0, Math.min(255, green))
                        blue = Math.max(0, Math.min(255, blue))
                        image.setRGB(x, y, (255 << 24) | (red << 16) | (green << 8) | blue)
                    }
                }
                javax.imageio.ImageIO.write(image, 'png',
                    new File(directory, 'attic_glass_snow_' + stage + '_v' + variant + '.png'))
            }
        }

        // Steep 45-degree roof panels: long, individual hanging ice fringes.
        // Render only from their real lower edge, preserving the original roof.
        for (int variant = 0; variant < 6; variant++) {
            for (int stage = 1; stage <= 8; stage++) {
                def image = new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                for (int x = 0; x < 16; x++) {
                    int stripe = Math.floorMod(x.intdiv(2) * 9 + variant * 13 + stage * 5, 11)
                    int depth = Math.min(16, Math.max(2,
                        2 + stage.intdiv(2) + (stripe < 4 ? 2 : 0)
                        + (x == Math.floorMod(variant * 7 + 3, 16) ? 4 : 0)
                        + (stage >= 6 && x == Math.floorMod(variant * 5 + 11, 16) ? 3 : 0)))
                    for (int y = 0; y < depth; y++) {
                        int shade = Math.floorMod(x * 11 + y.intdiv(2) * 17 + variant * 23, 13)
                        int red = shade < 4 ? 226 : (shade < 8 ? 243 : 251)
                        int green = shade < 4 ? 238 : (shade < 8 ? 247 : 252)
                        int blue = 255
                        boolean tip = y >= depth - 2 && (x == Math.floorMod(variant * 7 + 3, 16))
                        if (tip) { red = 182 + variant * 4; green = 223 + variant * 2; }
                        image.setRGB(x, y, (255 << 24) | (red << 16) | (green << 8) | blue)
                    }
                }
                javax.imageio.ImageIO.write(image, 'png',
                    new File(directory, 'steep_drip_' + stage + '_v' + variant + '.png'))
            }
        }

        // Transparent overlay textures for roof edges. Existing wood/stone remains visible.
        // Twelve silhouettes, changing gradually across 8 snow stages.
        for (int variant = 0; variant < 12; variant++) {
            for (int stage = 1; stage <= 8; stage++) {
                def image = new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                for (int x = 0; x < 16; x++) {
                    // Every gable has a distinctive, pixel-sharp snow fringe.
                    int drift = Math.floorMod(x.intdiv(2) * 11 + variant * 17 + x * 3, 9) - 4
                    int thickness = Math.max(1, Math.min(10, 1 + stage.intdiv(2) + drift.intdiv(2)))
                    int iceColumn = Math.floorMod(variant * 11 + 3, 16)
                    int secondIce = Math.floorMod(variant * 7 + 9, 16)
                    if (stage >= 4 && x == iceColumn) thickness += 2 + variant % 4
                    if (stage >= 6 && x == secondIce) thickness += 3
                    if (stage == 8 && Math.floorMod(x + variant * 5, 11) == 0) thickness += 3
                    thickness = Math.min(15, thickness)
                    for (int y = 0; y < 16; y++) {
                        if (y >= thickness) continue
                        int cluster = Math.floorMod(x * 23 + y.intdiv(2) * 13 + variant * 31, 17)
                        int shade = cluster < 4 ? -18 : cluster < 9 ? -9 : 0
                        int r = Math.max(0, Math.min(255, 247 + shade))
                        int g = Math.max(0, Math.min(255, 250 + shade))
                        int b = Math.max(0, Math.min(255, 255 + shade.intdiv(2)))
                        boolean ice = y >= thickness - 2 && (x == iceColumn || x == secondIce)
                        if (ice) { r = 185 + variant * 3; g = 225 + variant; b = 255; }
                        image.setRGB(x, y, (255 << 24) | (r << 16) | (g << 8) | b)
                    }
                }
                javax.imageio.ImageIO.write(image, 'png',
                    new File(directory, 'side_snow_' + stage + '_v' + variant + '.png'))
                // Thin, staggered trim on the true outer side only.
                // It is not rendered across stacked inner faces.
                def thin = new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                for (int x = 0; x < 16; x++) {
                    int irregular = Math.floorMod(x.intdiv(3) + variant * 5 + x * 7, 6)
                    int lip = Math.max(1, Math.min(4, 1 + stage.intdiv(4) + (irregular == 0 ? 1 : 0)))
                    if (stage >= 6 && x == Math.floorMod(variant * 7 + 4, 16)) lip += 2
                    for (int y = 0; y < Math.min(16, lip); y++) {
                        int shade = Math.floorMod(x * 13 + y * 17 + variant, 9) < 3 ? -15 : -4
                        int red = Math.max(0, Math.min(255, 247 + shade))
                        int green = Math.max(0, Math.min(255, 250 + shade))
                        int blue = Math.max(0, Math.min(255, 255 + shade.intdiv(3)))
                        thin.setRGB(x, y, (255 << 24) | (red << 16) | (green << 8) | blue)
                    }
                }
                javax.imageio.ImageIO.write(thin, 'png',
                    new File(directory, 'side_soft_' + stage + '_v' + variant + '.png'))
            }
        }
    }
}
tasks.named('processResources') { dependsOn('generateSnowTextures') }
