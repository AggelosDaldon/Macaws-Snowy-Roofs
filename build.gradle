plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '1.2.0'
group = 'com.daldon.snowyroofs'
base { archivesName = 'daldons-snowy-roofs' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { snowyroofs { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { snowyroofs { source sourceSets.main } } }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { manifest { attributes(['Specification-Title':'Daldons Snowy Roofs', 'Implementation-Version':project.version]) } }


// Generate Minecraft-style 16x16 snowy texture variants as real PNG resources.
// Keep this in Gradle so the GitHub Actions build packages them in the JAR.
def snowOutput = layout.buildDirectory.dir('generated/snowy-resources')
sourceSets.main.resources.srcDir(snowOutput)
tasks.register('generateSnowTextures') {
    outputs.dir(snowOutput)
    doLast {
        def directory = snowOutput.get().file('assets/daldonssnowyroofs/textures/block').asFile
        directory.mkdirs()
        def types = [
            base_roof: [106, 84, 76],
            white_roof: [224, 219, 211],
            black_roof: [59, 60, 65],
            gray_roof: [119, 118, 118],
            light_gray_roof: [169, 168, 171],
            thatch: [142, 116, 72],
            snow_generic: [225, 231, 240]
        ]
        types.each { name, base ->
            for (int stage = 1; stage <= 8; stage++) {
                def image = new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                def rng = new java.util.Random(name.hashCode() * 31L + 857L)
                for (int y = 0; y < 16; y++) {
                    for (int x = 0; x < 16; x++) {
                        // Smooth snowy-white finish, similar to classic vanilla snow:
                        // subtle gray-blue depth, gentle variation and tiny icy highlights.
                        double wave = (Math.sin(x * 0.83 + y * 0.28) +
                                       Math.cos(y * 0.67 - x * 0.21)) * 0.14
                        double detail = (rng.nextInt(9) - 4) / 50.0
                        double mask = Math.max(0, Math.min(1, (stage - 1) / 7.0 +
                                         0.16 + wave + detail))
                        double smooth = mask * mask * (3 - 2 * mask)
                        // Stage 8 is complete snow, with no bare-roof holes.
                        if (stage == 8) smooth = 1.0
                        int tone = (int) Math.round((Math.sin(x * 0.55 + y * 0.3) +
                                                     Math.cos(y * 0.57)) * 2.2)
                        int edgeShade = y >= 13 ? 6 : (y >= 10 ? 3 : 0)
                        int sparkle = (stage >= 5 && Math.floorMod(x * 19 + y * 29, 73) == 0) ? 7 : 0
                        int whiteR = 248 + tone - edgeShade + sparkle
                        int whiteG = 250 + tone - edgeShade + sparkle
                        int whiteB = 252 + tone - (edgeShade / 2) + sparkle
                        int r = Math.max(0, Math.min(255, Math.round(base[0] * (1.0 - smooth) + whiteR * smooth) as int))
                        int g = Math.max(0, Math.min(255, Math.round(base[1] * (1.0 - smooth) + whiteG * smooth) as int))
                        int b = Math.max(0, Math.min(255, Math.round(base[2] * (1.0 - smooth) + whiteB * smooth) as int))
                        image.setRGB(x, y, (255 << 24) | (r << 16) | (g << 8) | b)
                    }
                }
                javax.imageio.ImageIO.write(image, 'png', new File(directory, name + '_snow_' + stage + '.png'))
            }
        }
    }
}
tasks.named('processResources') { dependsOn('generateSnowTextures') }
