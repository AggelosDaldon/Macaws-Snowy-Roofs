plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '1.4.0'
group = 'com.daldon.snowyroofs'
base { archivesName = 'daldons-snowy-roofs' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { snowyroofs { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { snowyroofs { source sourceSets.main } } }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { manifest { attributes(['Specification-Title':'Daldons Snowy Roofs', 'Implementation-Version':project.version]) } }


// Generate Minecraft-style 16x16 snowy texture variants as real PNG resources.
// Keep this in Gradle so the GitHub Actions build packages them in the JAR.
def snowOutput = layout.buildDirectory.dir('generated/snowy-resources')
sourceSets.main.resources.srcDir(snowOutput)
tasks.register('generateSnowTextures') {
    outputs.dir(snowOutput)
    doLast {
        def directory = snowOutput.get().file('assets/daldonssnowyroofs/textures/block').asFile
        directory.mkdirs()
        def types = [
            base_roof: [106, 84, 76],
            white_roof: [224, 219, 211],
            black_roof: [59, 60, 65],
            gray_roof: [119, 118, 118],
            light_gray_roof: [169, 168, 171],
            thatch: [142, 116, 72],
            snow_generic: [225, 231, 240]
        ]
        types.each { name, base ->
            for (int variant = 0; variant < 6; variant++) {
                for (int stage = 1; stage <= 8; stage++) {
                    def image = new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                    def rng = new java.util.Random(name.hashCode() * 31L + variant * 811L + 857L)
                    for (int y = 0; y < 16; y++) {
                        for (int x = 0; x < 16; x++) {
                            // Crisp pixel clusters with high contrast; no blur or antialiasing.
                            // Each variant has a unique ridge, packed snowgrain and ice pattern.
                            int grainTile = Math.floorMod(x.intdiv(2) * 11 + y.intdiv(2) * 17 + variant * 23 + name.hashCode(), 13);
                            int ridgeTile = Math.floorMod(x * 3 + y * 2 + variant * 7, 17);
                            int patch = Math.floorMod(x.intdiv(3) * 19 + y.intdiv(3) * 29 + variant * 11, 23);
                            double density = Math.max(0.0, Math.min(1.0, (stage - 1) / 7.0 + 0.18
                                + (patch < 8 ? 0.15 : -0.08) + (ridgeTile < 6 ? 0.08 : 0.0)));
                            double cover = density * density * (3 - 2 * density);
                            if (stage == 8) cover = 1.0;

                            // Deliberately limited pixel palette: readable from a distance.
                            int tone = grainTile < 2 ? -16 : (grainTile < 5 ? -9 : (grainTile < 9 ? -3 : 2));
                            if (ridgeTile == 0 || ridgeTile == 1) tone -= 11;
                            int snowR = 248 + tone;
                            int snowG = 250 + tone;
                            int snowB = 254 + tone / 2;
                            // ALL six variants have icy crystals; each has different
                            // positions, sizes, silhouettes and blue highlight strength.
                            int iceX = 2 + Math.floorMod(variant * 7 + name.hashCode(), 11);
                            int iceY = 3 + Math.floorMod(variant * 3 + name.hashCode(), 8);
                            int dx = x - iceX, dy = y - iceY;
                            boolean needle = (Math.abs(dx) <= (variant % 3 == 0 ? 0 : 1)
                                    && dy >= -1 && dy <= (variant % 2 == 0 ? 3 : 2));
                            boolean crystalCluster = variant % 2 == 1 && dy == 1 && Math.abs(dx) <= 2;
                            boolean secondFleck = Math.floorMod(x * 13 + y * 7 + variant * 19, 101) == 0;
                            boolean crystal = stage >= 3 && (needle || crystalCluster || secondFleck);
                            if (crystal) {
                                int strength = 7 + variant * 5;
                                snowR = 222 - strength + (dx == 0 ? 12 : 0);
                                snowG = 237 - strength / 3 + (dy == -1 ? 10 : 0);
                                snowB = 255;
                            }
                            int r = Math.max(0, Math.min(255, Math.round(base[0] * (1.0 - cover) + snowR * cover) as int))
                            int g = Math.max(0, Math.min(255, Math.round(base[1] * (1.0 - cover) + snowG * cover) as int))
                            int b = Math.max(0, Math.min(255, Math.round(base[2] * (1.0 - cover) + snowB * cover) as int))
                            image.setRGB(x, y, (255 << 24) | (r << 16) | (g << 8) | b)
                        }
                    }
                    javax.imageio.ImageIO.write(image, 'png',
                        new File(directory, name + '_snow_' + stage + '_v' + variant + '.png'))
                }
            }
        }
    }
}
tasks.named('processResources') { dependsOn('generateSnowTextures') }
